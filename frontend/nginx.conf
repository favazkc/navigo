server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend container
    # Use Docker's embedded DNS resolver (127.0.0.11) so nginx re-resolves
    # on each request instead of caching the upstream IP at startup.
    # The variable form of proxy_pass passes the full original URI automatically.
    resolver 127.0.0.11 valid=5s;
    set $backend http://teamsphere-backend:4000;

    location /api/ {
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Cache static assets for 1 year
    location ~* \.(js|css|png|jpg|svg|woff|woff2|ttf|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html — no cache (SPA catch-all)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}

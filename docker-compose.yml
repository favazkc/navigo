version: '3.9'

services:
  backend:
    build:
      context: ./backend
    container_name: teamsphere-backend
    ports:
      - '4000:4000'
    env_file:
      - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
        VITE_APP_URL: ${VITE_APP_URL:-http://localhost:2000}
        VITE_COGNITO_CLIENT_ID: ${VITE_COGNITO_CLIENT_ID}
        VITE_COGNITO_DOMAIN: ${VITE_COGNITO_DOMAIN}
    container_name: teamsphere-frontend
    ports:
      - '2000:80'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

# Server
server.port=${PORT:4000}
server.error.whitelabel.enabled=false

# MongoDB
spring.data.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

# JWT (RSA key pair loaded from PEM files)
jwt.private-key-path=${JWT_PRIVATE_KEY_PATH}
jwt.public-key-path=${JWT_PUBLIC_KEY_PATH}
jwt.expires-in=${JWT_EXPIRES_IN:7d}

# Cognito
cognito.user-pool-id=${COGNITO_USER_POOL_ID}
cognito.client-id=${COGNITO_CLIENT_ID}
cognito.domain=${COGNITO_DOMAIN}

# Application
app.url=${APP_URL:http://localhost:2000}

# Spring Mail (SendGrid SMTP relay)
spring.mail.host=${SPRING_MAIL_HOST:smtp.sendgrid.net}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:apikey}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.from=${SPRING_MAIL_FROM:noreply@example.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Logging
logging.level.com.navigo=DEBUG
logging.level.org.springframework.security=WARN

# Embedded MongoDB for integration tests
# Flapdoodle replaces this URI with the embedded instance at runtime.
spring.data.mongodb.uri=mongodb://localhost:27017/navigo_test
spring.data.mongodb.auto-index-creation=true
de.flapdoodle.mongodb.embedded.version=7.0.5

# JWT — tests generate their own key pair via TestRsaKeyConfig
jwt.private-key-path=UNUSED_OVERRIDDEN_BY_TEST
jwt.public-key-path=UNUSED_OVERRIDDEN_BY_TEST
jwt.expires-in=1h

# Cognito (not used in tests)
cognito.user-pool-id=test-pool
cognito.client-id=test-client
cognito.domain=http://localhost:9999

# App
app.url=http://localhost:2000

# Mail (not used; mocked)
spring.mail.host=localhost
spring.mail.port=2525
spring.mail.from=test@example.com
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
spring.mail.properties.mail.smtp.starttls.required=false

# Disable Whitelabel
server.error.whitelabel.enabled=false

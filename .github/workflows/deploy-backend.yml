name: Deploy Backend to EC2

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'

jobs:
  build:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/navigo-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/navigo-backend:latest

  deploy:
    name: Pull & run on EC2
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE
          script: |
            set -e

            echo "--- Pulling image: $IMAGE ---"
            docker pull "$IMAGE"

            echo "--- Stopping existing container ---"
            docker stop navigo-backend || true
            docker rm navigo-backend || true

            echo "--- Starting container ---"
            docker run -d \
              --name navigo-backend \
              --restart unless-stopped \
              --env-file ~/navigo-backend.env \
              -v ~/jwt_private.pem:/run/secrets/jwt_private.pem:ro \
              -v ~/jwt_public.pem:/run/secrets/jwt_public.pem:ro \
              -p 4000:4000 \
              "$IMAGE"

            echo "--- Health check ---"
            sleep 5
            curl -f http://localhost:4000/health || exit 1

            echo "--- Deploy complete ---"
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/navigo-backend:${{ github.sha }}
